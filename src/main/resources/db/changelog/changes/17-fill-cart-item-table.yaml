databaseChangeLog:
  - changeSet:
      id: fill-cart-item-table
      author: bookshop
      changes:
        - insert:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: shopping_cart_id
                  valueNumeric: 1
              - column:
                  name: book_id
                  valueNumeric: 1
              - column:
                  name: quantity
                  valueNumeric: 1
              - column:
                  name: is_deleted
                  valueBoolean: false