databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: onlinebookstore
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: ENUM('ADMIN', 'USER')
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValue: false
